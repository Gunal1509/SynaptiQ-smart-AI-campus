apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fastapi-uploads-pvc
  namespace: synaptiq
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synaptiq-fastapi
  namespace: synaptiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synaptiq-fastapi
  template:
    metadata:
      labels:
        app: synaptiq-fastapi
    spec:
      containers:
        - name: fastapi-backend
          image: synaptiq-fastapi:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: synaptiq-config
                  key: MONGODB_URI
            - name: MONGODB_DB
              valueFrom:
                configMapKeyRef:
                  name: synaptiq-config
                  key: MONGODB_DB
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: synaptiq-secrets
                  key: GROQ_API_KEY
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: synaptiq-secrets
                  key: YOUTUBE_API_KEY
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: uploads-volume
              mountPath: /app/uploads
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: fastapi-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: synaptiq-fastapi
  namespace: synaptiq
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: synaptiq-fastapi
