apiVersion: apps/v1
kind: Deployment
metadata:
  name: synaptiq-frontend
  namespace: synaptiq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synaptiq-frontend
  template:
    metadata:
      labels:
        app: synaptiq-frontend
    spec:
      containers:
        - name: frontend-nginx
          image: synaptiq-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: synaptiq-frontend
  namespace: synaptiq
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: synaptiq-frontend
